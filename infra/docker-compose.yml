# Local dev services. Prod equivalents: managed Postgres (with pgvector) + S3/R2/GCS.
name: reel
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reel
      POSTGRES_PASSWORD: reel
      POSTGRES_DB: reel
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reel"]
      interval: 2s
      retries: 30

  # S3-compatible object store. Only needed when REEL_LAKE_URL=s3://... (see .env.example).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reel
      MINIO_ROOT_PASSWORD: reel-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    profiles: [s3]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 reel reel-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/reel-lake"
    profiles: [s3]

volumes:
  pgdata:
  miniodata:
